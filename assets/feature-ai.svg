<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <linearGradient id="aiMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="aiCore" x1="30%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#4d9fff"/>
    </linearGradient>
    <filter id="aiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="aiSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#aiBg)" stroke="url(#aiMain)" stroke-width="2" opacity="0.95"/>
  
  <!-- Outer soft glow ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Neural network nodes -->
  <g filter="url(#aiGlow)">
    <!-- Center core -->
    <circle cx="64" cy="64" r="14" fill="url(#aiCore)" opacity="0.95"/>
    <circle cx="64" cy="64" r="8" fill="#0a1224"/>
    <circle cx="64" cy="64" r="4" fill="#00e5ff"/>
    
    <!-- Surrounding nodes -->
    <circle cx="64" cy="32" r="6" fill="#00e5ff" opacity="0.9"/>
    <circle cx="92" cy="48" r="5.5" fill="#7b61ff" opacity="0.9"/>
    <circle cx="92" cy="80" r="5.5" fill="#00b4ff" opacity="0.9"/>
    <circle cx="64" cy="96" r="6" fill="#7b61ff" opacity="0.9"/>
    <circle cx="36" cy="80" r="5.5" fill="#00e5ff" opacity="0.9"/>
    <circle cx="36" cy="48" r="5.5" fill="#00b4ff" opacity="0.9"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="url(#aiMain)" stroke-width="1.8" opacity="0.7" filter="url(#aiSoft)">
    <line x1="64" y1="46" x2="64" y2="38"/>
    <line x1="74" y1="56" x2="87" y2="50"/>
    <line x1="74" y1="72" x2="87" y2="78"/>
    <line x1="64" y1="82" x2="64" y2="90"/>
    <line x1="54" y1="72" x2="41" y2="78"/>
    <line x1="54" y1="56" x2="41" y2="50"/>
  </g>
  
  <!-- Outer ring segments -->
  <path d="M64 18 A46 46 0 0 1 102 48" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.55" filter="url(#aiGlow)"/>
  <path d="M64 110 A46 46 0 0 1 26 80" fill="none" stroke="#7b61ff" stroke-width="2" stroke-linecap="round" opacity="0.55" filter="url(#aiGlow)"/>
  
  <!-- Tiny accent dots -->
  <circle cx="64" cy="18" r="2" fill="#00e5ff" opacity="0.8"/>
  <circle cx="110" cy="64" r="2" fill="#7b61ff" opacity="0.8"/>
  <circle cx="64" cy="110" r="2" fill="#00b4ff" opacity="0.8"/>
  <circle cx="18" cy="64" r="2" fill="#00e5ff" opacity="0.8"/>
</svg>
