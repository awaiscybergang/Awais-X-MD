<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <linearGradient id="secMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#4d9fff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="secGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="secSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#secBg)" stroke="url(#secMain)" stroke-width="2"/>
  
  <!-- Soft outer circle -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>
  
  <!-- Shield shape -->
  <g filter="url(#secGlow)">
    <path d="M64 22 
             C64 22, 96 30, 98 48 
             C98 72, 88 92, 64 108 
             C40 92, 30 72, 30 48 
             C32 30, 64 22, 64 22 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="3.5" opacity="0.95"/>
    
    <!-- Inner shield fill -->
    <path d="M64 30 
             C64 30, 90 36, 91 50 
             C91 70, 82 86, 64 100 
             C46 86, 37 70, 37 50 
             C38 36, 64 30, 64 30 Z" 
          fill="#00e5ff" opacity="0.07"/>
  </g>
  
  <!-- Lock body -->
  <g filter="url(#secGlow)">
    <rect x="50" y="62" width="28" height="24" rx="4" ry="4" fill="none" stroke="url(#lockGrad)" stroke-width="2.8"/>
    
    <!-- Lock shackle -->
    <path d="M56 62 V52 C56 46, 72 46, 72 52 V62" fill="none" stroke="url(#lockGrad)" stroke-width="2.8" stroke-linecap="round"/>
    
    <!-- Keyhole -->
    <circle cx="64" cy="72" r="3.5" fill="url(#lockGrad)"/>
    <rect x="62.5" y="72" width="3" height="7" rx="1" fill="url(#lockGrad)"/>
  </g>
  
  <!-- Side protective lines -->
  <g stroke="url(#secMain)" stroke-width="1.6" opacity="0.45" filter="url(#secSoft)">
    <path d="M18 48 L26 48"/>
    <path d="M18 64 L28 64"/>
    <path d="M18 80 L26 80"/>
    <path d="M110 48 L102 48"/>
    <path d="M110 64 L100 64"/>
    <path d="M110 80 L102 80"/>
  </g>
  
  <!-- Top accent -->
  <circle cx="64" cy="14" r="2.5" fill="#00e5ff" opacity="0.8" filter="url(#secGlow)"/>
  <circle cx="64" cy="114" r="2" fill="#7b61ff" opacity="0.7"/>
  
  <!-- Corner marks -->
  <path d="M16 20 L16 14 L22 14" fill="none" stroke="#00e5ff" stroke-width="1.6" opacity="0.5"/>
  <path d="M112 20 L112 14 L106 14" fill="none" stroke="#7b61ff" stroke-width="1.6" opacity="0.5"/>
</svg>
