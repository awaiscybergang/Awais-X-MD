<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mediaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <linearGradient id="mediaMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#4dcfff"/>
    </linearGradient>
    <filter id="mediaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="mediaSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#mediaBg)" stroke="url(#mediaMain)" stroke-width="2"/>
  
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.18"/>
  
  <!-- Media frame / screen -->
  <rect x="30" y="36" width="68" height="48" rx="8" ry="8" fill="none" stroke="url(#mediaMain)" stroke-width="2.5" filter="url(#mediaGlow)"/>
  
  <!-- Inner screen fill hint -->
  <rect x="36" y="42" width="56" height="36" rx="4" ry="4" fill="#00e5ff" opacity="0.08"/>
  
  <!-- Play triangle -->
  <g filter="url(#mediaGlow)">
    <polygon points="52,48 52,72 76,60" fill="url(#playGrad)" opacity="0.95"/>
  </g>
  
  <!-- Download / media arrows -->
  <g stroke="url(#mediaMain)" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#mediaSoft)">
    <!-- Left arrow down -->
    <path d="M42 96 L42 108"/>
    <path d="M36 104 L42 110 L48 104"/>
    
    <!-- Right arrow down -->
    <path d="M86 96 L86 108"/>
    <path d="M80 104 L86 110 L92 104"/>
  </g>
  
  <!-- Top accent bars (like signal / waveform) -->
  <g fill="url(#mediaMain)" opacity="0.75" filter="url(#mediaGlow)">
    <rect x="48" y="22" width="4" height="8" rx="1"/>
    <rect x="56" y="18" width="4" height="12" rx="1"/>
    <rect x="64" y="20" width="4" height="10" rx="1"/>
    <rect x="72" y="16" width="4" height="14" rx="1"/>
    <rect x="80" y="22" width="4" height="8" rx="1"/>
  </g>
  
  <!-- Corner accents -->
  <path d="M22 28 L22 20 L30 20" fill="none" stroke="#00e5ff" stroke-width="1.8" opacity="0.5"/>
  <path d="M106 28 L106 20 L98 20" fill="none" stroke="#7b61ff" stroke-width="1.8" opacity="0.5"/>
  <path d="M22 100 L22 108 L30 108" fill="none" stroke="#00e5ff" stroke-width="1.8" opacity="0.5"/>
  <path d="M106 100 L106 108 L98 108" fill="none" stroke="#7b61ff" stroke-width="1.8" opacity="0.5"/>
  
  <!-- Small dots -->
  <circle cx="64" cy="12" r="2" fill="#00e5ff" opacity="0.7"/>
  <circle cx="64" cy="116" r="2" fill="#7b61ff" opacity="0.7"/>
</svg>
