<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#0d1a2f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="120" cy="120" r="118" fill="url(#bgGrad)"/>
  
  <!-- Outer ring with glow -->
  <circle cx="120" cy="120" r="108" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" filter="url(#softGlow)" opacity="0.95"/>
  
  <!-- Secondary thin ring -->
  <circle cx="120" cy="120" r="98" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.35"/>
  
  <!-- Decorative arc segments -->
  <path d="M120 22 A98 98 0 0 1 210 90" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
  <path d="M120 218 A98 98 0 0 1 30 150" fill="none" stroke="#7b61ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
  
  <!-- Inner hexagon frame -->
  <polygon points="120,48 178,78 178,162 120,192 62,162 62,78" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" opacity="0.55"/>
  
  <!-- Core circle -->
  <circle cx="120" cy="120" r="52" fill="url(#innerGrad)" stroke="url(#coreGrad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Letter A stylized -->
  <g filter="url(#strongGlow)">
    <path d="M88 155 L120 72 L152 155" fill="none" stroke="url(#coreGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 128 H140" fill="none" stroke="url(#coreGrad)" stroke-width="7" stroke-linecap="round"/>
  </g>
  
  <!-- Small X accent -->
  <g opacity="0.9" filter="url(#glow)">
    <line x1="158" y1="68" x2="172" y2="82" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="172" y1="68" x2="158" y2="82" stroke="#7b61ff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  
  <!-- Accent dots -->
  <circle cx="120" cy="38" r="3.5" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="120" cy="202" r="3.5" fill="#7b61ff" filter="url(#glow)"/>
  <circle cx="42" cy="120" r="2.5" fill="#00b4ff" opacity="0.8"/>
  <circle cx="198" cy="120" r="2.5" fill="#00e5ff" opacity="0.8"/>
</svg>
